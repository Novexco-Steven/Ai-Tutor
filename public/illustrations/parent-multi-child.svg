<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Multi-Child Support: Multiple profiles -->
  <defs>
    <linearGradient id="child1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="child2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="child3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Profile cards -->
  <!-- Child 1 -->
  <rect x="20" y="40" width="50" height="80" rx="8" fill="#1e293b"/>
  <circle cx="45" cy="65" r="18" fill="url(#child1)"/>
  <circle cx="45" cy="61" r="7" fill="white"/>
  <ellipse cx="45" cy="71" rx="8" ry="4" fill="white"/>
  <text x="45" y="95" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">Emma</text>
  <text x="45" y="105" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">Grade 4</text>
  <rect x="28" y="110" width="34" height="4" rx="2" fill="#334155"/>
  <rect x="28" y="110" width="24" height="4" rx="2" fill="url(#child1)"/>

  <!-- Child 2 -->
  <rect x="75" y="30" width="50" height="80" rx="8" fill="#1e293b"/>
  <circle cx="100" cy="55" r="18" fill="url(#child2)"/>
  <circle cx="100" cy="51" r="7" fill="white"/>
  <ellipse cx="100" cy="61" rx="8" ry="4" fill="white"/>
  <text x="100" y="85" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">Alex</text>
  <text x="100" y="95" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">Grade 7</text>
  <rect x="83" y="100" width="34" height="4" rx="2" fill="#334155"/>
  <rect x="83" y="100" width="30" height="4" rx="2" fill="url(#child2)"/>

  <!-- Child 3 -->
  <rect x="130" y="40" width="50" height="80" rx="8" fill="#1e293b"/>
  <circle cx="155" cy="65" r="18" fill="url(#child3)"/>
  <circle cx="155" cy="61" r="7" fill="white"/>
  <ellipse cx="155" cy="71" rx="8" ry="4" fill="white"/>
  <text x="155" y="95" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">Sam</text>
  <text x="155" y="105" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">Grade 2</text>
  <rect x="138" y="110" width="34" height="4" rx="2" fill="#334155"/>
  <rect x="138" y="110" width="18" height="4" rx="2" fill="url(#child3)"/>

  <!-- Connection line at bottom -->
  <line x1="45" y1="125" x2="155" y2="125" stroke="#334155" stroke-width="2"/>
  <circle cx="45" cy="125" r="4" fill="#0ea5e9"/>
  <circle cx="100" cy="125" r="4" fill="#8b5cf6"/>
  <circle cx="155" cy="125" r="4" fill="#f97316"/>

  <!-- Parent icon -->
  <circle cx="100" cy="140" r="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <circle cx="100" cy="137" r="4" fill="#22c55e"/>
  <ellipse cx="100" cy="145" rx="5" ry="3" fill="#22c55e"/>

  <!-- Decorative -->
  <circle cx="15" cy="25" r="3" fill="#facc15" opacity="0.6"/>
  <circle cx="185" cy="25" r="3" fill="#facc15" opacity="0.5"/>
</svg>
