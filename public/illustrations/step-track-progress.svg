<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Track Your Progress - Analytics dashboard with growth -->

  <defs>
    <linearGradient id="trackBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="trackGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="trackPurple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Main dashboard card -->
  <rect x="30" y="25" width="140" height="110" rx="10" fill="#1e293b"/>

  <!-- Mini chart area -->
  <rect x="40" y="35" width="80" height="55" rx="6" fill="#0f172a"/>

  <!-- Grid lines -->
  <line x1="45" y1="50" x2="115" y2="50" stroke="#334155" stroke-width="1"/>
  <line x1="45" y1="65" x2="115" y2="65" stroke="#334155" stroke-width="1"/>
  <line x1="45" y1="80" x2="115" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Progress line chart -->
  <path d="M50 75 L65 68 L80 60 L95 50 L110 42" stroke="url(#trackGreen)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Data points -->
  <circle cx="50" cy="75" r="4" fill="#10b981"/>
  <circle cx="65" cy="68" r="4" fill="#10b981"/>
  <circle cx="80" cy="60" r="4" fill="#10b981"/>
  <circle cx="95" cy="50" r="4" fill="#22c55e"/>
  <circle cx="110" cy="42" r="4" fill="#22c55e"/>

  <!-- Stats cards on right -->
  <rect x="125" y="35" width="40" height="24" rx="4" fill="#0f172a"/>
  <text x="145" y="47" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#22c55e" text-anchor="middle">+15%</text>
  <text x="145" y="56" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">This Week</text>

  <rect x="125" y="63" width="40" height="24" rx="4" fill="#0f172a"/>
  <text x="145" y="75" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0ea5e9" text-anchor="middle">42</text>
  <text x="145" y="84" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">Lessons</text>

  <!-- Skill bars at bottom -->
  <rect x="40" y="98" width="125" height="8" rx="4" fill="#0f172a"/>
  <text x="40" y="94" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">Math</text>
  <rect x="40" y="98" width="95" height="8" rx="4" fill="url(#trackBlue)"/>
  <text x="138" y="105" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">95%</text>

  <rect x="40" y="115" width="125" height="8" rx="4" fill="#0f172a"/>
  <text x="40" y="111" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">Science</text>
  <rect x="40" y="115" width="85" height="8" rx="4" fill="url(#trackPurple)"/>
  <text x="128" y="122" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">85%</text>

  <!-- Trophy/achievement icon -->
  <circle cx="175" cy="50" r="18" fill="url(#trackGreen)" opacity="0.2"/>
  <path d="M170 45 L180 45 L178 55 L172 55 Z" fill="#fbbf24"/>
  <rect x="173" y="55" width="4" height="4" fill="#fbbf24"/>
  <rect x="170" y="58" width="10" height="3" rx="1" fill="#fbbf24"/>
  <path d="M165 45 L170 45 L170 50 Q165 50 165 45" fill="#fbbf24" opacity="0.7"/>
  <path d="M180 45 L185 45 Q185 50 180 50 L180 45" fill="#fbbf24" opacity="0.7"/>

  <!-- Parent/teacher notification icon -->
  <circle cx="25" cy="100" r="15" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="25" cy="96" r="5" fill="#0ea5e9"/>
  <ellipse cx="25" cy="106" rx="7" ry="4" fill="#0ea5e9"/>

  <!-- Notification badge -->
  <circle cx="35" cy="90" r="6" fill="#22c55e"/>
  <path d="M32 90 L34 92 L38 88" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Decorative -->
  <circle cx="180" cy="130" r="4" fill="#facc15" opacity="0.6"/>
  <circle cx="20" cy="40" r="3" fill="#facc15" opacity="0.5"/>
</svg>
