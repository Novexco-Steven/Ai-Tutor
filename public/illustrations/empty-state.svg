<svg width="300" height="250" viewBox="0 0 300 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State Illustration: Books and sparkle -->

  <defs>
    <linearGradient id="bookGradient1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bookGradient2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bookGradient3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="125" r="100" fill="#f0f9ff" opacity="0.5"/>

  <!-- Stack of books -->
  <!-- Bottom book (blue) -->
  <rect x="80" y="160" width="140" height="30" rx="4" fill="url(#bookGradient1)"/>
  <rect x="85" y="165" width="5" height="20" fill="white" opacity="0.3"/>

  <!-- Middle book (purple) -->
  <rect x="90" y="125" width="120" height="30" rx="4" fill="url(#bookGradient2)" transform="rotate(-5 150 140)"/>
  <rect x="95" y="130" width="5" height="20" fill="white" opacity="0.3" transform="rotate(-5 97 140)"/>

  <!-- Top book (green) -->
  <rect x="100" y="92" width="100" height="28" rx="4" fill="url(#bookGradient3)" transform="rotate(3 150 106)"/>
  <rect x="105" y="97" width="4" height="18" fill="white" opacity="0.3" transform="rotate(3 107 106)"/>

  <!-- Sparkles -->
  <circle cx="220" cy="80" r="6" fill="#facc15"/>
  <circle cx="80" cy="100" r="4" fill="#facc15"/>
  <circle cx="240" cy="130" r="5" fill="#facc15"/>
  <circle cx="60" cy="150" r="3" fill="#facc15"/>

  <!-- Stars -->
  <polygon points="180,60 182,66 188,66 183,70 185,76 180,72 175,76 177,70 172,66 178,66" fill="#0ea5e9" opacity="0.7"/>
  <polygon points="250,160 251,164 255,164 252,167 253,171 250,169 247,171 248,167 245,164 249,164" fill="#8b5cf6" opacity="0.7"/>

  <!-- Decorative dots -->
  <circle cx="100" cy="200" r="3" fill="#cbd5e1"/>
  <circle cx="150" cy="210" r="3" fill="#cbd5e1"/>
  <circle cx="200" cy="200" r="3" fill="#cbd5e1"/>
</svg>
