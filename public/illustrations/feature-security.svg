<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Safe & Secure: Shield with lock, COPPA badge, secure connection -->

  <defs>
    <linearGradient id="securityGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="securityBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Large shield background -->
  <path d="M100 15 L150 35 L150 85 C150 115 125 140 100 150 C75 140 50 115 50 85 L50 35 Z" fill="url(#securityGreen)" opacity="0.2"/>

  <!-- Shield main -->
  <path d="M100 25 L140 42 L140 82 C140 107 120 127 100 135 C80 127 60 107 60 82 L60 42 Z" fill="url(#securityGreen)"/>

  <!-- Inner shield detail -->
  <path d="M100 35 L130 48 L130 80 C130 100 115 115 100 122 C85 115 70 100 70 80 L70 48 Z" fill="#10b981"/>

  <!-- Lock icon in center -->
  <rect x="88" y="72" width="24" height="20" rx="4" fill="white"/>
  <path d="M92 72 L92 65 C92 58 96 55 100 55 C104 55 108 58 108 65 L108 72" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="82" r="4" fill="#10b981"/>
  <rect x="98" y="82" width="4" height="6" fill="#10b981"/>

  <!-- Checkmark on shield -->
  <circle cx="100" cy="105" r="10" fill="white" opacity="0.3"/>
  <path d="M93 105 L98 110 L108 100" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- COPPA badge -->
  <rect x="15" y="45" width="30" height="40" rx="4" fill="#1e293b"/>
  <text x="30" y="62" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#10b981" text-anchor="middle">COPPA</text>
  <path d="M22 72 L27 77 L38 66" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Encryption badge -->
  <rect x="155" y="45" width="30" height="40" rx="4" fill="#1e293b"/>
  <text x="170" y="62" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#0ea5e9" text-anchor="middle">256-bit</text>
  <rect x="162" y="68" width="16" height="10" rx="2" fill="#0ea5e9"/>
  <circle cx="170" cy="73" r="2" fill="#1e293b"/>

  <!-- Secure connection dots -->
  <circle cx="35" cy="110" r="6" fill="url(#securityBlue)"/>
  <circle cx="55" cy="95" r="4" fill="url(#securityBlue)" opacity="0.7"/>
  <circle cx="145" cy="95" r="4" fill="url(#securityBlue)" opacity="0.7"/>
  <circle cx="165" cy="110" r="6" fill="url(#securityBlue)"/>

  <!-- Connection lines -->
  <line x1="41" y1="107" x2="55" y2="95" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
  <line x1="55" y1="95" x2="70" y2="82" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="82" x2="145" y2="95" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>
  <line x1="145" y1="95" x2="159" y2="107" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>

  <!-- Child-safe icon hint -->
  <circle cx="30" cy="135" r="12" fill="#fbbf24" opacity="0.8"/>
  <circle cx="30" cy="132" r="5" fill="white"/>
  <ellipse cx="30" cy="140" rx="6" ry="4" fill="white"/>
  <path d="M24 128 L26 130 L28 128" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Stars -->
  <circle cx="175" cy="130" r="3" fill="#facc15" opacity="0.7"/>
  <circle cx="185" cy="20" r="4" fill="#facc15" opacity="0.6"/>
  <circle cx="20" cy="25" r="3" fill="#facc15" opacity="0.5"/>
</svg>
