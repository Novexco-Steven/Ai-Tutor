<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Curriculum Alignment: Standards checklist -->
  <defs>
    <linearGradient id="currPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Main document -->
  <rect x="40" y="20" width="120" height="125" rx="8" fill="#1e293b"/>

  <!-- Header -->
  <rect x="40" y="20" width="120" height="25" rx="8" fill="url(#currPurple)"/>
  <rect x="40" y="37" width="120" height="8" fill="url(#currPurple)"/>
  <text x="100" y="37" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="white" text-anchor="middle">Standards Aligned</text>

  <!-- Common Core badge -->
  <rect x="55" y="52" width="90" height="18" rx="4" fill="#0f172a"/>
  <circle cx="67" cy="61" r="6" fill="#22c55e"/>
  <path d="M64 61 L66 63 L70 59" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="105" y="64" font-family="Inter, sans-serif" font-size="7" fill="white" text-anchor="middle">Common Core</text>

  <!-- Checklist items -->
  <rect x="50" y="78" width="12" height="12" rx="3" fill="#22c55e"/>
  <path d="M53 84 L55 86 L59 82" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <rect x="68" y="80" width="55" height="6" rx="3" fill="#334155"/>
  <text x="95" y="86" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle">Math CCSS 4.NF</text>

  <rect x="50" y="96" width="12" height="12" rx="3" fill="#22c55e"/>
  <path d="M53 102 L55 104 L59 100" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <rect x="68" y="98" width="55" height="6" rx="3" fill="#334155"/>
  <text x="95" y="104" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle">ELA RL.4.1</text>

  <rect x="50" y="114" width="12" height="12" rx="3" fill="#22c55e"/>
  <path d="M53 120 L55 122 L59 118" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <rect x="68" y="116" width="55" height="6" rx="3" fill="#334155"/>
  <text x="95" y="122" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle">NGSS 4-ESS</text>

  <!-- Progress badge -->
  <rect x="125" y="78" width="25" height="50" rx="5" fill="#0f172a"/>
  <text x="137" y="93" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">✓</text>
  <text x="137" y="108" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">100%</text>
  <text x="137" y="118" font-family="Inter, sans-serif" font-size="5" fill="#64748b" text-anchor="middle">Aligned</text>

  <!-- Decorative -->
  <circle cx="175" cy="45" r="4" fill="#facc15" opacity="0.7"/>
  <circle cx="25" cy="100" r="3" fill="#facc15" opacity="0.5"/>
</svg>
