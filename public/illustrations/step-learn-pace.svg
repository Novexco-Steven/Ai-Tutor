<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 2: Learn at Your Pace - Adaptive learning with AI tutor -->

  <defs>
    <linearGradient id="paceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="paceYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Main lesson card -->
  <rect x="45" y="30" width="110" height="85" rx="10" fill="#1e293b"/>
  <rect x="45" y="30" width="110" height="20" rx="10" fill="url(#paceBlue)"/>
  <rect x="45" y="40" width="110" height="10" fill="url(#paceBlue)"/>

  <!-- Progress bar in header -->
  <rect x="55" y="36" width="60" height="8" rx="4" fill="#0c4a6e"/>
  <rect x="55" y="36" width="40" height="8" rx="4" fill="white" opacity="0.9"/>
  <text x="125" y="43" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">67%</text>

  <!-- Lesson content lines -->
  <rect x="55" y="58" width="70" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="70" width="85" height="6" rx="3" fill="#334155"/>
  <rect x="55" y="82" width="55" height="6" rx="3" fill="#334155"/>

  <!-- Interactive element - highlighted -->
  <rect x="55" y="95" width="90" height="12" rx="4" fill="url(#paceBlue)" opacity="0.3"/>
  <rect x="58" y="98" width="6" height="6" rx="1" fill="#0ea5e9"/>
  <rect x="68" y="99" width="40" height="4" rx="2" fill="#64748b"/>

  <!-- AI tutor helper bubble -->
  <circle cx="165" cy="75" r="22" fill="url(#paceYellow)"/>
  <circle cx="160" cy="70" r="4" fill="#1e293b"/>
  <circle cx="170" cy="70" r="4" fill="#1e293b"/>
  <path d="M158 78 Q165 84 172 78" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Speech bubble from tutor -->
  <rect x="130" y="40" width="50" height="22" rx="6" fill="white"/>
  <polygon points="145,62 150,62 148,68" fill="white"/>
  <text x="155" y="53" font-family="Inter, sans-serif" font-size="7" fill="#1e293b" text-anchor="middle">Need help?</text>

  <!-- Speed indicator -->
  <rect x="20" y="70" width="18" height="50" rx="4" fill="#1e293b"/>
  <rect x="23" y="95" width="12" height="22" rx="2" fill="url(#paceBlue)"/>
  <text x="29" y="85" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">PACE</text>

  <!-- Adaptive arrows -->
  <path d="M29 68 L29 60 L24 65 M29 60 L34 65" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Lightning bolt accent -->
  <path d="M85 130 L90 140 L87 140 L92 150 L85 142 L88 142 L83 130 Z" fill="#fbbf24" opacity="0.8"/>

  <!-- Decorative dots -->
  <circle cx="30" cy="130" r="4" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="170" cy="130" r="3" fill="#facc15" opacity="0.6"/>
  <circle cx="50" cy="140" r="2" fill="#10b981" opacity="0.4"/>
</svg>
