<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Parent Dashboard: Family profiles with progress indicators -->

  <defs>
    <linearGradient id="parentGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="parentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Dashboard card background -->
  <rect x="25" y="20" width="150" height="120" rx="12" fill="#1e293b"/>
  <rect x="25" y="20" width="150" height="30" rx="12" fill="url(#parentGreen)"/>
  <rect x="25" y="38" width="150" height="12" fill="url(#parentGreen)"/>

  <!-- Dashboard header -->
  <text x="40" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">Parent Dashboard</text>

  <!-- Parent avatar (large) -->
  <circle cx="55" cy="75" r="18" fill="#475569"/>
  <circle cx="55" cy="70" r="8" fill="#94a3b8"/>
  <ellipse cx="55" cy="85" rx="10" ry="6" fill="#94a3b8"/>

  <!-- Child avatars (smaller) -->
  <circle cx="95" cy="75" r="14" fill="#0ea5e9"/>
  <circle cx="95" cy="71" r="6" fill="#7dd3fc"/>
  <ellipse cx="95" cy="82" rx="7" ry="4" fill="#7dd3fc"/>

  <circle cx="130" cy="75" r="14" fill="#a855f7"/>
  <circle cx="130" cy="71" r="6" fill="#d8b4fe"/>
  <ellipse cx="130" cy="82" rx="7" ry="4" fill="#d8b4fe"/>

  <!-- Progress indicators -->
  <rect x="40" y="100" width="50" height="6" rx="3" fill="#334155"/>
  <rect x="40" y="100" width="35" height="6" rx="3" fill="url(#parentBlue)"/>
  <text x="40" y="118" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Emma - 70%</text>

  <rect x="105" y="100" width="50" height="6" rx="3" fill="#334155"/>
  <rect x="105" y="100" width="42" height="6" rx="3" fill="#a855f7"/>
  <text x="105" y="118" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Alex - 85%</text>

  <!-- Connection lines from parent to children -->
  <line x1="70" y1="75" x2="82" y2="75" stroke="#475569" stroke-width="2"/>
  <line x1="109" y1="75" x2="117" y2="75" stroke="#475569" stroke-width="2"/>

  <!-- Notification bell -->
  <circle cx="160" cy="35" r="10" fill="#fbbf24"/>
  <path d="M155 35 L160 30 L165 35 L165 38 L155 38 Z" fill="white"/>
  <circle cx="160" cy="40" r="2" fill="white"/>
  <circle cx="165" cy="30" r="4" fill="#ef4444"/>
  <text x="165" y="32" font-family="Inter, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle">2</text>

  <!-- Chart icon hint -->
  <rect x="155" y="95" width="5" height="25" rx="1" fill="#22c55e" opacity="0.6"/>
  <rect x="162" y="105" width="5" height="15" rx="1" fill="#0ea5e9" opacity="0.6"/>

  <!-- Decorative -->
  <circle cx="185" cy="60" r="4" fill="#facc15" opacity="0.7"/>
  <circle cx="15" cy="80" r="3" fill="#facc15" opacity="0.5"/>
</svg>
