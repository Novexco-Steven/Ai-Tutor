<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen Time Controls: Clock with schedule -->
  <defs>
    <linearGradient id="timeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Large clock -->
  <circle cx="100" cy="75" r="45" fill="#1e293b"/>
  <circle cx="100" cy="75" r="40" fill="#0f172a"/>
  <circle cx="100" cy="75" r="38" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Clock marks -->
  <line x1="100" y1="40" x2="100" y2="45" stroke="#64748b" stroke-width="2"/>
  <line x1="100" y1="105" x2="100" y2="110" stroke="#64748b" stroke-width="2"/>
  <line x1="65" y1="75" x2="70" y2="75" stroke="#64748b" stroke-width="2"/>
  <line x1="130" y1="75" x2="135" y2="75" stroke="#64748b" stroke-width="2"/>

  <!-- Active time arc (green) -->
  <circle cx="100" cy="75" r="32" fill="none" stroke="#22c55e" stroke-width="6"
          stroke-dasharray="100 101" stroke-linecap="round" transform="rotate(-90 100 75)"/>

  <!-- Clock hands -->
  <line x1="100" y1="75" x2="100" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="118" y2="75" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="75" r="4" fill="url(#timeBlue)"/>

  <!-- Time limit badge -->
  <rect x="130" y="40" width="50" height="28" rx="6" fill="#1e293b"/>
  <text x="155" y="52" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Daily Limit</text>
  <text x="155" y="63" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">2h 30m</text>

  <!-- Schedule bars -->
  <rect x="25" y="125" width="150" height="25" rx="6" fill="#1e293b"/>
  <rect x="30" y="130" width="30" height="15" rx="3" fill="#22c55e" opacity="0.3"/>
  <rect x="65" y="130" width="40" height="15" rx="3" fill="#22c55e"/>
  <rect x="110" y="130" width="25" height="15" rx="3" fill="#22c55e" opacity="0.3"/>
  <rect x="140" y="130" width="30" height="15" rx="3" fill="#334155"/>

  <text x="45" y="140" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">AM</text>
  <text x="85" y="140" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle">3-5 PM</text>
  <text x="155" y="140" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">Night</text>

  <!-- Decorative -->
  <circle cx="30" cy="50" r="3" fill="#facc15" opacity="0.6"/>
</svg>
