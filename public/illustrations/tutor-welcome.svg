<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tulomi Tutor: Welcome Pose - Friendly waving tutor -->

  <defs>
    <linearGradient id="skinGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8c9a0"/>
      <stop offset="100%" stop-color="#e8b892"/>
    </linearGradient>
    <linearGradient id="shirtGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="hairGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#3a2a1c"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#f0f9ff" opacity="0.5"/>

  <!-- Body -->
  <ellipse cx="200" cy="350" rx="80" ry="50" fill="url(#shirtGradient)"/>

  <!-- Neck -->
  <rect x="180" y="250" width="40" height="40" rx="10" fill="url(#skinGradient)"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="70" ry="80" fill="url(#skinGradient)"/>

  <!-- Hair -->
  <ellipse cx="200" cy="130" rx="75" ry="50" fill="url(#hairGradient)"/>
  <ellipse cx="140" cy="160" rx="20" ry="40" fill="url(#hairGradient)"/>
  <ellipse cx="260" cy="160" rx="20" ry="40" fill="url(#hairGradient)"/>

  <!-- Eyes -->
  <ellipse cx="170" cy="180" rx="15" ry="18" fill="white"/>
  <ellipse cx="230" cy="180" rx="15" ry="18" fill="white"/>
  <circle cx="172" cy="182" r="8" fill="#1e293b"/>
  <circle cx="232" cy="182" r="8" fill="#1e293b"/>
  <circle cx="174" cy="179" r="3" fill="white"/>
  <circle cx="234" cy="179" r="3" fill="white"/>

  <!-- Eyebrows (friendly raised) -->
  <path d="M155 160 Q170 152 185 158" stroke="#3a2a1c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M215 158 Q230 152 245 160" stroke="#3a2a1c" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M165 215 Q200 245 235 215" stroke="#c4856c" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Waving arm -->
  <ellipse cx="310" cy="280" rx="25" ry="20" fill="url(#skinGradient)"/>
  <path d="M270 320 Q300 250 315 270" stroke="url(#shirtGradient)" stroke-width="40" stroke-linecap="round" fill="none"/>

  <!-- Other arm -->
  <path d="M130 320 Q110 330 100 360" stroke="url(#shirtGradient)" stroke-width="40" stroke-linecap="round" fill="none"/>

  <!-- Sparkles around waving hand -->
  <circle cx="340" cy="250" r="6" fill="#facc15"/>
  <circle cx="355" cy="290" r="4" fill="#facc15"/>
  <circle cx="325" cy="235" r="3" fill="#facc15"/>
</svg>
