<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Curriculum Aligned: Books with checkmarks, organized subjects -->

  <defs>
    <linearGradient id="currBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="currGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="currPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="currOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Stack of books -->
  <!-- Bottom book (blue - Math) -->
  <rect x="40" y="100" width="120" height="25" rx="3" fill="url(#currBlue)"/>
  <rect x="45" y="105" width="4" height="15" fill="white" opacity="0.3"/>
  <text x="65" y="117" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white">Math</text>

  <!-- Second book (green - Science) -->
  <rect x="45" y="72" width="110" height="25" rx="3" fill="url(#currGreen)" transform="rotate(-3 100 84)"/>
  <rect x="50" y="77" width="4" height="15" fill="white" opacity="0.3" transform="rotate(-3 52 84)"/>
  <text x="70" y="89" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white" transform="rotate(-3 85 89)">Science</text>

  <!-- Third book (purple - Reading) -->
  <rect x="50" y="45" width="100" height="24" rx="3" fill="url(#currPurple)" transform="rotate(2 100 57)"/>
  <rect x="55" y="50" width="4" height="14" fill="white" opacity="0.3" transform="rotate(2 57 57)"/>
  <text x="75" y="62" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white" transform="rotate(2 90 62)">Reading</text>

  <!-- Top book (orange - History) -->
  <rect x="55" y="20" width="90" height="22" rx="3" fill="url(#currOrange)" transform="rotate(-1 100 31)"/>
  <rect x="60" y="25" width="4" height="12" fill="white" opacity="0.3" transform="rotate(-1 62 31)"/>
  <text x="80" y="35" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white" transform="rotate(-1 95 35)">History</text>

  <!-- Checkmark badges on books -->
  <circle cx="145" cy="112" r="12" fill="#10b981"/>
  <path d="M139 112 L143 116 L151 108" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <circle cx="140" cy="84" r="10" fill="#10b981"/>
  <path d="M135 84 L138 87 L145 80" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <circle cx="135" cy="57" r="10" fill="#10b981"/>
  <path d="M130 57 L133 60 L140 53" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <circle cx="130" cy="31" r="10" fill="#10b981"/>
  <path d="M125 31 L128 34 L135 27" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- K-12 badge -->
  <rect x="15" y="60" width="35" height="50" rx="5" fill="#1e293b"/>
  <text x="32" y="82" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">K-12</text>
  <text x="32" y="100" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Standards</text>

  <!-- Decorative elements -->
  <circle cx="175" cy="40" r="5" fill="#facc15" opacity="0.8"/>
  <circle cx="180" cy="90" r="4" fill="#facc15" opacity="0.6"/>
  <circle cx="20" cy="130" r="3" fill="#facc15" opacity="0.7"/>
</svg>
