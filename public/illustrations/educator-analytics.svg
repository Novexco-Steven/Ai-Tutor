<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Student Analytics: Performance insights -->
  <defs>
    <linearGradient id="analyticsPurple2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Main card -->
  <rect x="30" y="25" width="140" height="110" rx="10" fill="#1e293b"/>

  <!-- Student profile section -->
  <circle cx="55" cy="50" r="15" fill="url(#analyticsPurple2)"/>
  <circle cx="55" cy="47" r="6" fill="white"/>
  <ellipse cx="55" cy="55" rx="7" ry="4" fill="white"/>

  <text x="80" y="45" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white">Student Report</text>
  <text x="80" y="57" font-family="Inter, sans-serif" font-size="7" fill="#64748b">Performance Analysis</text>

  <!-- Alert indicator -->
  <circle cx="155" cy="40" r="10" fill="#ef4444" opacity="0.2"/>
  <text x="155" y="44" font-family="Inter, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">!</text>

  <!-- Performance bars -->
  <text x="40" y="80" font-family="Inter, sans-serif" font-size="7" fill="#94a3b8">Math</text>
  <rect x="70" y="74" width="90" height="8" rx="4" fill="#0f172a"/>
  <rect x="70" y="74" width="75" height="8" rx="4" fill="#22c55e"/>

  <text x="40" y="96" font-family="Inter, sans-serif" font-size="7" fill="#94a3b8">Reading</text>
  <rect x="70" y="90" width="90" height="8" rx="4" fill="#0f172a"/>
  <rect x="70" y="90" width="60" height="8" rx="4" fill="#0ea5e9"/>

  <text x="40" y="112" font-family="Inter, sans-serif" font-size="7" fill="#94a3b8">Science</text>
  <rect x="70" y="106" width="90" height="8" rx="4" fill="#0f172a"/>
  <rect x="70" y="106" width="40" height="8" rx="4" fill="#f97316"/>

  <!-- Insight badge -->
  <rect x="40" y="120" width="120" height="20" rx="5" fill="#0f172a"/>
  <circle cx="52" cy="130" r="6" fill="#fbbf24"/>
  <text x="52" y="133" font-family="Inter, sans-serif" font-size="8" fill="#1e293b" text-anchor="middle">💡</text>
  <text x="115" y="133" font-family="Inter, sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">Needs help with fractions</text>

  <!-- Trend indicator -->
  <path d="M175 80 L180 70 L185 80 M180 70 L180 95" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <!-- Decorative -->
  <circle cx="20" cy="45" r="3" fill="#facc15" opacity="0.6"/>
</svg>
