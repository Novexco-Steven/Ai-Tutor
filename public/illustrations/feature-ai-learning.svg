<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AI-Powered Learning: Brain with neural connections and sparkles -->

  <defs>
    <linearGradient id="aiGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="aiGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="100" cy="80" rx="70" ry="55" fill="#0ea5e9" opacity="0.1"/>

  <!-- Brain shape -->
  <path d="M100 30 C60 30 45 55 45 80 C45 105 60 125 100 125 C140 125 155 105 155 80 C155 55 140 30 100 30" fill="url(#aiGrad1)" opacity="0.2"/>

  <!-- Brain details (wrinkles) -->
  <path d="M70 60 Q85 50 100 60 Q115 70 130 60" stroke="url(#aiGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M60 80 Q80 70 100 80 Q120 90 140 80" stroke="url(#aiGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M70 100 Q85 90 100 100 Q115 110 130 100" stroke="url(#aiGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Neural connection nodes -->
  <circle cx="65" cy="55" r="8" fill="url(#aiGrad1)"/>
  <circle cx="100" cy="45" r="10" fill="url(#aiGrad2)"/>
  <circle cx="135" cy="55" r="8" fill="url(#aiGrad1)"/>
  <circle cx="55" cy="85" r="7" fill="url(#aiGrad2)"/>
  <circle cx="145" cy="85" r="7" fill="url(#aiGrad2)"/>
  <circle cx="70" cy="115" r="8" fill="url(#aiGrad1)"/>
  <circle cx="130" cy="115" r="8" fill="url(#aiGrad1)"/>

  <!-- Connection lines -->
  <line x1="65" y1="55" x2="100" y2="45" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="45" x2="135" y2="55" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
  <line x1="55" y1="85" x2="65" y2="55" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="145" y1="85" x2="135" y2="55" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="55" y1="85" x2="70" y2="115" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
  <line x1="145" y1="85" x2="130" y2="115" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>

  <!-- Sparkles -->
  <circle cx="40" cy="40" r="4" fill="#facc15"/>
  <circle cx="160" cy="45" r="3" fill="#facc15"/>
  <circle cx="35" cy="110" r="3" fill="#facc15"/>
  <circle cx="165" cy="105" r="4" fill="#facc15"/>

  <!-- Student figure (simplified) -->
  <circle cx="100" cy="140" r="10" fill="#64748b"/>
  <rect x="92" y="148" width="16" height="8" rx="3" fill="#64748b"/>
</svg>
