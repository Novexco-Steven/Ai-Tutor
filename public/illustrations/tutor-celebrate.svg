<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tulomi Tutor: Celebration Pose - Arms up, excited -->

  <defs>
    <linearGradient id="celebSkinGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8c9a0"/>
      <stop offset="100%" stop-color="#e8b892"/>
    </linearGradient>
    <linearGradient id="celebShirtGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="celebHairGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#3a2a1c"/>
    </linearGradient>
  </defs>

  <!-- Confetti -->
  <circle cx="80" cy="100" r="8" fill="#f97316"/>
  <rect x="120" y="80" width="12" height="12" rx="2" fill="#a855f7" transform="rotate(30 126 86)"/>
  <circle cx="300" cy="90" r="10" fill="#22c55e"/>
  <rect x="340" y="120" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(-20 345 125)"/>
  <circle cx="60" cy="180" r="6" fill="#facc15"/>
  <rect x="350" y="200" width="8" height="8" rx="1" fill="#3b82f6" transform="rotate(45 354 204)"/>
  <circle cx="100" cy="250" r="5" fill="#14b8a6"/>
  <circle cx="320" cy="280" r="7" fill="#f97316"/>

  <!-- Background burst -->
  <circle cx="200" cy="200" r="160" fill="#fef9c3" opacity="0.3"/>

  <!-- Body -->
  <ellipse cx="200" cy="360" rx="75" ry="45" fill="url(#celebShirtGradient)"/>

  <!-- Neck -->
  <rect x="185" y="260" width="30" height="35" rx="8" fill="url(#celebSkinGradient)"/>

  <!-- Head (slightly tilted up) -->
  <ellipse cx="200" cy="190" rx="65" ry="75" fill="url(#celebSkinGradient)"/>

  <!-- Hair -->
  <ellipse cx="200" cy="140" rx="70" ry="45" fill="url(#celebHairGradient)"/>
  <ellipse cx="145" cy="165" rx="18" ry="35" fill="url(#celebHairGradient)"/>
  <ellipse cx="255" cy="165" rx="18" ry="35" fill="url(#celebHairGradient)"/>

  <!-- Excited eyes (closed happy arcs) -->
  <path d="M155 185 Q170 175 185 185" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M215 185 Q230 175 245 185" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Big smile -->
  <path d="M160 220 Q200 260 240 220" stroke="#c4856c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M165 225 Q200 255 235 225" fill="#c4856c"/>

  <!-- Cheek blush -->
  <ellipse cx="145" cy="205" rx="12" ry="8" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="255" cy="205" rx="12" ry="8" fill="#fca5a5" opacity="0.5"/>

  <!-- Arms raised up in celebration -->
  <path d="M130 330 Q90 280 70 180" stroke="url(#celebShirtGradient)" stroke-width="38" stroke-linecap="round" fill="none"/>
  <path d="M270 330 Q310 280 330 180" stroke="url(#celebShirtGradient)" stroke-width="38" stroke-linecap="round" fill="none"/>

  <!-- Hands -->
  <ellipse cx="65" cy="165" rx="22" ry="18" fill="url(#celebSkinGradient)"/>
  <ellipse cx="335" cy="165" rx="22" ry="18" fill="url(#celebSkinGradient)"/>

  <!-- Stars around hands -->
  <polygon points="50,130 53,140 63,140 55,147 58,157 50,150 42,157 45,147 37,140 47,140" fill="#facc15"/>
  <polygon points="350,130 353,140 363,140 355,147 358,157 350,150 342,157 345,147 337,140 347,140" fill="#facc15"/>
</svg>
