<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tulomi Tutor: Teaching Pose - Pointing/explaining -->

  <defs>
    <linearGradient id="teachSkinGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8c9a0"/>
      <stop offset="100%" stop-color="#e8b892"/>
    </linearGradient>
    <linearGradient id="teachShirtGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="teachHairGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#3a2a1c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="180" fill="#f0f9ff" opacity="0.3"/>

  <!-- Lightbulb idea indicator -->
  <circle cx="320" cy="80" r="35" fill="#fef9c3"/>
  <path d="M320 60 L320 50" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 65 L348 57" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <path d="M345 85 L355 85" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 100 Q320 90 312 85 Q305 82 305 75 Q305 65 320 65 Q335 65 335 75 Q335 82 328 85 Q320 90 320 100" fill="none" stroke="#facc15" stroke-width="4"/>
  <rect x="312" y="100" width="16" height="6" rx="2" fill="#facc15"/>

  <!-- Body -->
  <ellipse cx="200" cy="360" rx="80" ry="50" fill="url(#teachShirtGradient)"/>

  <!-- Neck -->
  <rect x="182" y="255" width="36" height="38" rx="10" fill="url(#teachSkinGradient)"/>

  <!-- Head -->
  <ellipse cx="200" cy="185" rx="68" ry="78" fill="url(#teachSkinGradient)"/>

  <!-- Hair -->
  <ellipse cx="200" cy="132" rx="73" ry="48" fill="url(#teachHairGradient)"/>
  <ellipse cx="142" cy="162" rx="18" ry="38" fill="url(#teachHairGradient)"/>
  <ellipse cx="258" cy="162" rx="18" ry="38" fill="url(#teachHairGradient)"/>

  <!-- Glasses -->
  <circle cx="168" cy="180" r="25" fill="none" stroke="#64748b" stroke-width="4"/>
  <circle cx="232" cy="180" r="25" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M193 180 L207 180" stroke="#64748b" stroke-width="4"/>
  <path d="M143 175 L135 168" stroke="#64748b" stroke-width="4"/>
  <path d="M257 175 L265 168" stroke="#64748b" stroke-width="4"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="168" cy="182" rx="10" ry="12" fill="white"/>
  <ellipse cx="232" cy="182" rx="10" ry="12" fill="white"/>
  <circle cx="170" cy="183" r="6" fill="#1e293b"/>
  <circle cx="234" cy="183" r="6" fill="#1e293b"/>
  <circle cx="171" cy="181" r="2" fill="white"/>
  <circle cx="235" cy="181" r="2" fill="white"/>

  <!-- Thoughtful eyebrows -->
  <path d="M150 158 Q168 150 186 156" stroke="#3a2a1c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M214 156 Q232 150 250 158" stroke="#3a2a1c" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Explaining smile -->
  <path d="M175 220 Q200 235 225 220" stroke="#c4856c" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Pointing arm (right) -->
  <path d="M270 320 Q320 280 350 250" stroke="url(#teachShirtGradient)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <ellipse cx="365" cy="235" rx="20" ry="15" fill="url(#teachSkinGradient)"/>
  <!-- Pointing finger -->
  <rect x="365" y="225" width="30" height="10" rx="5" fill="url(#teachSkinGradient)"/>

  <!-- Other arm (gesture) -->
  <path d="M130 320 Q100 300 85 320" stroke="url(#teachShirtGradient)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <ellipse cx="80" cy="330" rx="18" ry="14" fill="url(#teachSkinGradient)"/>
</svg>
