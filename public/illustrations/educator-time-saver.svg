<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Time Saver: Clock with automation -->
  <defs>
    <linearGradient id="timePurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Large clock -->
  <circle cx="100" cy="75" r="40" fill="#1e293b"/>
  <circle cx="100" cy="75" r="35" fill="#0f172a"/>

  <!-- Clock face -->
  <circle cx="100" cy="75" r="32" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Saved time arc -->
  <circle cx="100" cy="75" r="28" fill="none" stroke="url(#timePurple)" stroke-width="6"
          stroke-dasharray="70 106" stroke-linecap="round" transform="rotate(-90 100 75)"/>

  <!-- Clock hands -->
  <line x1="100" y1="75" x2="100" y2="55" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="115" y2="80" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="75" r="4" fill="url(#timePurple)"/>

  <!-- Check marks around (completed tasks) -->
  <circle cx="60" cy="45" r="10" fill="#22c55e" opacity="0.2"/>
  <path d="M56 45 L58 47 L64 41" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <circle cx="140" cy="45" r="10" fill="#22c55e" opacity="0.2"/>
  <path d="M136 45 L138 47 L144 41" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <circle cx="140" cy="105" r="10" fill="#22c55e" opacity="0.2"/>
  <path d="M136 105 L138 107 L144 101" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <!-- Time saved badge -->
  <rect x="35" y="115" width="55" height="30" rx="6" fill="#1e293b"/>
  <text x="62" y="130" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Time Saved</text>
  <text x="62" y="142" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#22c55e" text-anchor="middle">5+ hrs/wk</text>

  <!-- Auto-grade badge -->
  <rect x="110" y="115" width="55" height="30" rx="6" fill="#1e293b"/>
  <text x="137" y="130" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Auto-Graded</text>
  <text x="137" y="142" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="url(#timePurple)" text-anchor="middle">100%</text>

  <!-- Fast forward arrows -->
  <path d="M55 75 L45 68 L45 82 Z" fill="url(#timePurple)"/>
  <path d="M45 75 L35 68 L35 82 Z" fill="url(#timePurple)" opacity="0.6"/>

  <!-- Decorative -->
  <circle cx="170" cy="30" r="3" fill="#facc15" opacity="0.6"/>
</svg>
