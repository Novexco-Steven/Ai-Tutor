<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Detailed Analytics: Charts and graphs showing progress -->

  <defs>
    <linearGradient id="analyticsBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="analyticsPurple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="analyticsGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Main chart area background -->
  <rect x="25" y="25" width="150" height="100" rx="8" fill="#1e293b" opacity="0.5"/>

  <!-- Grid lines -->
  <line x1="45" y1="40" x2="165" y2="40" stroke="#334155" stroke-width="1"/>
  <line x1="45" y1="60" x2="165" y2="60" stroke="#334155" stroke-width="1"/>
  <line x1="45" y1="80" x2="165" y2="80" stroke="#334155" stroke-width="1"/>
  <line x1="45" y1="100" x2="165" y2="100" stroke="#334155" stroke-width="1"/>
  <line x1="45" y1="115" x2="165" y2="115" stroke="#334155" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="35" y="43" font-family="Inter, sans-serif" font-size="7" fill="#64748b">100</text>
  <text x="35" y="63" font-family="Inter, sans-serif" font-size="7" fill="#64748b">75</text>
  <text x="35" y="83" font-family="Inter, sans-serif" font-size="7" fill="#64748b">50</text>
  <text x="35" y="103" font-family="Inter, sans-serif" font-size="7" fill="#64748b">25</text>

  <!-- Bar chart -->
  <rect x="55" y="70" width="15" height="45" rx="3" fill="url(#analyticsBlue)"/>
  <rect x="80" y="55" width="15" height="60" rx="3" fill="url(#analyticsPurple)"/>
  <rect x="105" y="45" width="15" height="70" rx="3" fill="url(#analyticsGreen)"/>
  <rect x="130" y="35" width="15" height="80" rx="3" fill="url(#analyticsBlue)"/>

  <!-- X-axis labels -->
  <text x="60" y="125" font-family="Inter, sans-serif" font-size="7" fill="#64748b">W1</text>
  <text x="85" y="125" font-family="Inter, sans-serif" font-size="7" fill="#64748b">W2</text>
  <text x="110" y="125" font-family="Inter, sans-serif" font-size="7" fill="#64748b">W3</text>
  <text x="135" y="125" font-family="Inter, sans-serif" font-size="7" fill="#64748b">W4</text>

  <!-- Trend line -->
  <path d="M62 68 L87 52 L112 42 L137 32" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Data points on trend -->
  <circle cx="62" cy="68" r="5" fill="#0ea5e9"/>
  <circle cx="87" cy="52" r="5" fill="#14b8a6"/>
  <circle cx="112" cy="42" r="5" fill="#22c55e"/>
  <circle cx="137" cy="32" r="5" fill="#22c55e"/>

  <!-- Stats badges -->
  <rect x="15" y="130" width="50" height="25" rx="5" fill="#10b981"/>
  <text x="40" y="142" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">+23%</text>
  <text x="40" y="151" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle" opacity="0.8">Growth</text>

  <rect x="135" y="130" width="50" height="25" rx="5" fill="#0ea5e9"/>
  <text x="160" y="142" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="white" text-anchor="middle">92%</text>
  <text x="160" y="151" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle" opacity="0.8">Accuracy</text>

  <!-- Upward arrow indicator -->
  <path d="M175 20 L180 10 L185 20 M180 10 L180 35" stroke="#22c55e" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
