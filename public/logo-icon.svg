<svg width="512" height="512" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tulomi Icon: Compact version for favicons and app icons -->

  <defs>
    <linearGradient id="iconGradient" x1="50" y1="180" x2="150" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Left flowing curve -->
  <path
    d="M60 160 Q40 120 50 80 Q60 50 85 40"
    stroke="url(#iconGradient)"
    stroke-width="18"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Right flowing curve -->
  <path
    d="M140 160 Q160 120 150 80 Q140 50 115 40"
    stroke="url(#iconGradient)"
    stroke-width="18"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Center connecting curves -->
  <path
    d="M75 120 Q100 90 100 55"
    stroke="url(#iconGradient)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M125 120 Q100 90 100 55"
    stroke="url(#iconGradient)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Spark at top -->
  <circle cx="100" cy="35" r="14" fill="#38bdf8"/>
  <circle cx="100" cy="20" r="5" fill="#7dd3fc" opacity="0.8"/>
</svg>
