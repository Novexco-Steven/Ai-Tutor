<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tulomi OG Image for Social Sharing -->

  <defs>
    <linearGradient id="ogBgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ogLogoGradient" x1="50" y1="180" x2="150" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ogAccentGradient" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="url(#ogAccentGradient)"/>
  <circle cx="100" cy="530" r="150" fill="url(#ogAccentGradient)"/>

  <!-- Logo icon -->
  <g transform="translate(100, 165) scale(1.5)">
    <!-- Left curve -->
    <path
      d="M60 160 Q40 120 50 80 Q60 50 85 40"
      stroke="url(#ogLogoGradient)"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Right curve -->
    <path
      d="M140 160 Q160 120 150 80 Q140 50 115 40"
      stroke="url(#ogLogoGradient)"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Center curves -->
    <path
      d="M75 120 Q100 90 100 55"
      stroke="url(#ogLogoGradient)"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M125 120 Q100 90 100 55"
      stroke="url(#ogLogoGradient)"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Spark -->
    <circle cx="100" cy="35" r="14" fill="#38bdf8"/>
    <circle cx="100" cy="20" r="5" fill="#7dd3fc" opacity="0.8"/>
  </g>

  <!-- Text content -->
  <text x="420" y="280" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="700" fill="white">
    Tulomi
  </text>

  <text x="420" y="360" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="400" fill="#94a3b8">
    Learn What You Love
  </text>

  <text x="420" y="420" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="400" fill="#64748b">
    AI-powered personalized tutoring for K-12 students
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#0ea5e9"/>
</svg>
