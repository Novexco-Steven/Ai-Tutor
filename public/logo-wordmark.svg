<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tulomi Wordmark: Icon + Text -->

  <defs>
    <linearGradient id="wmGradient" x1="10" y1="70" x2="70" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Mini logo icon -->
  <g transform="translate(5, 5) scale(0.35)">
    <!-- Left curve -->
    <path
      d="M60 160 Q40 120 50 80 Q60 50 85 40"
      stroke="url(#wmGradient)"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Right curve -->
    <path
      d="M140 160 Q160 120 150 80 Q140 50 115 40"
      stroke="url(#wmGradient)"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Center curves -->
    <path
      d="M75 120 Q100 90 100 55"
      stroke="url(#wmGradient)"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M125 120 Q100 90 100 55"
      stroke="url(#wmGradient)"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Spark -->
    <circle cx="100" cy="35" r="14" fill="#38bdf8"/>
  </g>

  <!-- Tulomi text -->
  <text
    x="85"
    y="52"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="36"
    font-weight="700"
    fill="#0f172a"
  >
    Tulomi
  </text>
</svg>
